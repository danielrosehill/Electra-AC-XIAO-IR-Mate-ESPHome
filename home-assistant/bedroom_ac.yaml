# Bedroom AC: Electra central unit, IR via the XIAO Smart IR Mate running
# custom ESPHome firmware (device name "bedroom-ac-ir").
# Source of truth: https://github.com/danielrosehill/electra-ac-xiao-ir-mate-esphome
# Install: copy to /config/packages/ (needs `homeassistant: packages:` enabled).
#
# Protocol reverse-engineered 2026-07-21 (Manchester, 34-bit core, no checksum).
# Power = TOGGLE frame; state frames set mode/temp/fan but do NOT power the unit.
# The firmware builds the frames itself (action esphome.bedroom_ac_ir_send_frame),
# so there is no code table. (Before 2026-11-13 this package sent 120 stored
# Broadlink codes to a remote entity; those codes are in
# https://github.com/danielrosehill/electra-central-ac-ir-codes.)
#
# The IR Mate also HEARS the handheld remote. Each decoded frame arrives as
# event esphome.electra_ir_received {toggle, mode, temp, fan, core}, and
# bedroom_ac_sync_from_remote copies it into the helpers WITHOUT re-sending
# (input_boolean.bedroom_ac_ir_syncing blocks bedroom_ac_apply_on_change).

input_boolean:
  bedroom_ac_on:
    name: Bedroom AC (assumed on)
    icon: mdi:air-conditioner
  bedroom_ac_ir_syncing:
    name: Bedroom AC syncing from remote
    icon: mdi:remote
    initial: false   # never restore a stuck "on": it would block every AC change

input_select:
  bedroom_ac_mode:
    name: Bedroom AC Mode
    options: [cool, heat]
    initial: cool
    icon: mdi:thermostat
  bedroom_ac_fan:
    name: Bedroom AC Fan
    options: [low, med, high, auto]
    initial: high
    icon: mdi:fan

input_number:
  bedroom_ac_temp:
    name: Bedroom AC Temperature
    min: 16
    max: 30
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:thermometer

script:
  bedroom_ac_apply_state:
    alias: Bedroom AC — Apply State
    icon: mdi:air-conditioner
    sequence:
      - action: esphome.bedroom_ac_ir_send_frame
        data:
          toggle: false
          mode: "{{ states('input_select.bedroom_ac_mode') }}"
          temp: "{{ states('input_number.bedroom_ac_temp') | int }}"
          fan: "{{ states('input_select.bedroom_ac_fan') }}"

  bedroom_ac_power_toggle:
    alias: Bedroom AC — Power Toggle
    icon: mdi:power
    sequence:
      # Same frame as the original Broadlink capture: toggle flag + cool 19 high.
      - action: esphome.bedroom_ac_ir_send_frame
        data:
          toggle: true
          mode: cool
          temp: 19
          fan: high
      - action: input_boolean.toggle
        target:
          entity_id: input_boolean.bedroom_ac_on
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.bedroom_ac_on
                state: "on"
            sequence:
              - delay: {seconds: 1}
              - action: script.bedroom_ac_apply_state

automation:
  - alias: Bedroom AC — apply on setting change
    id: bedroom_ac_apply_on_change
    trigger:
      - platform: state
        entity_id:
          - input_number.bedroom_ac_temp
          - input_select.bedroom_ac_mode
          - input_select.bedroom_ac_fan
    condition:
      - condition: state
        entity_id: input_boolean.bedroom_ac_on
        state: "on"
      - condition: state
        entity_id: input_boolean.bedroom_ac_ir_syncing
        state: "off"
    mode: restart
    action:
      - service: script.bedroom_ac_apply_state

  - alias: Bedroom AC — sync helpers from handheld remote
    id: bedroom_ac_sync_from_remote
    description: >-
      The IR Mate decoded an Electra frame (handheld remote or another blaster).
      Copy mode/temp/fan into the helpers and flip the assumed power state on a
      toggle frame, without sending anything back.
    mode: queued
    triggers:
      - trigger: event
        event_type: esphome.electra_ir_received
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.event.data.mode in ['cool', 'heat']
             and trigger.event.data.fan in ['low', 'med', 'high', 'auto']
             and 16 <= (trigger.event.data.temp | int(0)) <= 30 }}
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bedroom_ac_ir_syncing
      - if:
          - condition: template
            value_template: "{{ trigger.event.data.toggle == 'true' }}"
        then:
          - action: input_boolean.toggle
            target:
              entity_id: input_boolean.bedroom_ac_on
      - action: input_select.select_option
        target:
          entity_id: input_select.bedroom_ac_mode
        data:
          option: "{{ trigger.event.data.mode }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.bedroom_ac_fan
        data:
          option: "{{ trigger.event.data.fan }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.bedroom_ac_temp
        data:
          value: "{{ trigger.event.data.temp | int }}"
      - delay: {seconds: 2}
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bedroom_ac_ir_syncing
