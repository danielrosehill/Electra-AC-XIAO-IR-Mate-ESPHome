# House AC: Electra central (ducted) unit, IR via the XIAO Smart IR Mate running
# custom ESPHome firmware (device name "bedroom-ac-ir").
# Source of truth: https://github.com/danielrosehill/Electra-AC-XIAO-IR-Mate-ESPHome
# Install: copy to /config/packages/ (needs `homeassistant: packages:` enabled).
#
# Protocol reverse-engineered 2026-07-21 (Manchester, 34-bit core, no checksum).
# Power = TOGGLE frame; state frames set mode/temp/fan but do NOT power the unit.
# The firmware builds the frames itself (action esphome.bedroom_ac_ir_send_frame),
# so there is no code table. (Before 2026-11-13 this package sent 120 stored
# Broadlink codes to a remote entity; those codes are in
# https://github.com/danielrosehill/electra-central-ac-ir-codes.)
#
# The IR Mate also HEARS the handheld remote. Each decoded frame arrives as
# event esphome.electra_ir_received {toggle, mode, temp, fan, core}, and
# bedroom_ac_sync_from_remote copies it into the helpers WITHOUT re-sending
# (input_boolean.bedroom_ac_ir_syncing blocks bedroom_ac_apply_on_change).
#
# Entity ids keep their original "bedroom_ac" prefix (dashboards, the comfort
# thermostat and scripts reference them); the unit is the whole-house central AC,
# so friendly names say "House AC".
#
# Voice (HA Assist): switch.house_ac does real on/off (it only toggles when the
# assumed state differs). Exposing input_boolean.bedroom_ac_on instead would be
# wrong: switching it only changes HA's assumption, no IR is sent. Assist has no
# built-in intents for input_number/input_select helpers, so temperature, fan
# and mode are custom sentences (automation house_ac_voice). Set aliases and
# exposure on switch.house_ac in the UI (Settings > Voice assistants > Expose).

input_boolean:
  bedroom_ac_on:
    name: House AC (assumed on)
    icon: mdi:air-conditioner
  bedroom_ac_ir_syncing:
    name: House AC syncing from remote
    icon: mdi:remote
    initial: false   # never restore a stuck "on": it would block every AC change

input_select:
  bedroom_ac_mode:
    name: House AC Mode
    options: [cool, heat]
    # No `initial:` - it would reset the helper on every restart and desync it
    # from the unit (removed 2026-11-13). The helper restores its last state.
    icon: mdi:thermostat
  bedroom_ac_fan:
    name: House AC Fan
    options: [low, med, high, auto]
    icon: mdi:fan

input_number:
  bedroom_ac_temp:
    name: House AC Temperature
    min: 16
    max: 30
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:thermometer

script:
  bedroom_ac_apply_state:
    alias: House AC — Apply State
    icon: mdi:air-conditioner
    sequence:
      - action: esphome.bedroom_ac_ir_send_frame
        data:
          toggle: false
          mode: "{{ states('input_select.bedroom_ac_mode') }}"
          temp: "{{ states('input_number.bedroom_ac_temp') | int }}"
          fan: "{{ states('input_select.bedroom_ac_fan') }}"

  bedroom_ac_power_toggle:
    alias: House AC — Power Toggle
    icon: mdi:power
    sequence:
      # Same frame as the original Broadlink capture: toggle flag + cool 19 high.
      - action: esphome.bedroom_ac_ir_send_frame
        data:
          toggle: true
          mode: cool
          temp: 19
          fan: high
      - action: input_boolean.toggle
        target:
          entity_id: input_boolean.bedroom_ac_on
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.bedroom_ac_on
                state: "on"
            sequence:
              - delay: {seconds: 1}
              - action: script.bedroom_ac_apply_state

# Standard climate entity for the thermostat card and Assist's built-in climate
# intents. Needs the HACS integration "Climate Template"
# (jcwillox/hass-template-climate, domain climate_template, v1.4.2) and a restart
# the first time. It is only a view over the helpers above: every set_* writes a
# helper (or runs the power toggle), and the existing automations send the IR.
climate:
  - platform: climate_template
    name: House AC
    unique_id: house_ac_climate
    icon_template: mdi:air-conditioner
    modes: ["off", "cool", "heat"]
    fan_modes: ["low", "medium", "high", "auto"]
    min_temp: 16
    max_temp: 30
    temp_step: 1
    precision: 0.1   # display of current temp; setpoints still step 1
    # Whichever room the comfort thermostat is watching.
    current_temperature_template: "{{ states('sensor.comfort_thermostat_room_temperature') }}"
    target_temperature_template: "{{ states('input_number.bedroom_ac_temp') | int(22) }}"
    hvac_mode_template: >-
      {{ states('input_select.bedroom_ac_mode') if is_state('input_boolean.bedroom_ac_on', 'on') else 'off' }}
    fan_mode_template: >-
      {{ {'med': 'medium'}.get(states('input_select.bedroom_ac_fan'), states('input_select.bedroom_ac_fan')) }}
    set_temperature:
      - action: input_number.set_value
        target:
          entity_id: input_number.bedroom_ac_temp
        data:
          value: "{{ temperature | round(0) | int }}"
    set_fan_mode:
      - action: input_select.select_option
        target:
          entity_id: input_select.bedroom_ac_fan
        data:
          option: "{{ {'medium': 'med'}.get(fan_mode, fan_mode) }}"
    set_hvac_mode:
      - choose:
          - conditions: "{{ hvac_mode == 'off' }}"
            sequence:
              - if:
                  - condition: state
                    entity_id: input_boolean.bedroom_ac_on
                    state: "on"
                then:
                  - action: script.bedroom_ac_power_toggle
        default:
          # cool/heat: set the mode; if the AC is off, power it on (the toggle
          # script applies the full state a second later).
          - action: input_select.select_option
            target:
              entity_id: input_select.bedroom_ac_mode
            data:
              option: "{{ hvac_mode }}"
          - if:
              - condition: state
                entity_id: input_boolean.bedroom_ac_on
                state: "off"
            then:
              - action: script.bedroom_ac_power_toggle

template:
  - switch:
      - name: House AC
        unique_id: house_ac_power
        icon: mdi:air-conditioner
        state: "{{ is_state('input_boolean.bedroom_ac_on', 'on') }}"
        turn_on:
          - if:
              - condition: state
                entity_id: input_boolean.bedroom_ac_on
                state: "off"
            then:
              - action: script.bedroom_ac_power_toggle
        turn_off:
          - if:
              - condition: state
                entity_id: input_boolean.bedroom_ac_on
                state: "on"
            then:
              - action: script.bedroom_ac_power_toggle

automation:
  - alias: House AC — apply on setting change
    id: bedroom_ac_apply_on_change
    trigger:
      - platform: state
        entity_id:
          - input_number.bedroom_ac_temp
          - input_select.bedroom_ac_mode
          - input_select.bedroom_ac_fan
        # `to: null` = real value changes only. Without it, attribute-only
        # changes (a reload that renames a helper) re-sent the frame
        # (seen 2026-11-13 21:19:50 UTC).
        to: ~
    condition:
      - condition: state
        entity_id: input_boolean.bedroom_ac_on
        state: "on"
      - condition: state
        entity_id: input_boolean.bedroom_ac_ir_syncing
        state: "off"
    mode: restart
    action:
      - service: script.bedroom_ac_apply_state

  - alias: House AC — sync helpers from handheld remote
    id: bedroom_ac_sync_from_remote
    description: >-
      The IR Mate decoded an Electra frame (handheld remote or another blaster).
      Copy mode/temp/fan into the helpers and flip the assumed power state on a
      toggle frame, without sending anything back.
    mode: queued
    triggers:
      - trigger: event
        event_type: esphome.electra_ir_received
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.event.data.mode in ['cool', 'heat']
             and trigger.event.data.fan in ['low', 'med', 'high', 'auto']
             and 16 <= (trigger.event.data.temp | int(0)) <= 30 }}
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bedroom_ac_ir_syncing
      - if:
          - condition: template
            value_template: "{{ trigger.event.data.toggle == 'true' }}"
        then:
          - action: input_boolean.toggle
            target:
              entity_id: input_boolean.bedroom_ac_on
      - action: input_select.select_option
        target:
          entity_id: input_select.bedroom_ac_mode
        data:
          option: "{{ trigger.event.data.mode }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.bedroom_ac_fan
        data:
          option: "{{ trigger.event.data.fan }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.bedroom_ac_temp
        data:
          value: "{{ trigger.event.data.temp | int }}"
      - delay: {seconds: 2}
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bedroom_ac_ir_syncing

  - alias: House AC — voice commands
    id: house_ac_voice
    description: >-
      Assist sentences for temperature, fan and mode. They set the helpers;
      bedroom_ac_apply_on_change sends the frame when the AC is on. Power
      on/off is switch.house_ac (built-in turn on/off intents).
    mode: queued
    triggers:
      - trigger: conversation
        id: set
        command:
          - "set [the] (AC|A C|aircon|air conditioner|air conditioning) to {value} [degrees]"
          - "(AC|A C|aircon|air conditioner|air conditioning) to {value} [degrees]"
          - "switch [the] (AC|A C|aircon|air conditioner|air conditioning) to {value} [mode]"
      - trigger: conversation
        id: warmer
        command:
          - "[make] [the] (AC|A C|aircon|air conditioner|air conditioning) (warmer|hotter)"
          - "turn up [the] (AC|A C|aircon|air conditioner|air conditioning) [temperature]"
          - "raise [the] (AC|A C|aircon|air conditioner|air conditioning) [temperature]"
      - trigger: conversation
        id: cooler
        command:
          - "[make] [the] (AC|A C|aircon|air conditioner|air conditioning) (cooler|colder)"
          - "turn down [the] (AC|A C|aircon|air conditioner|air conditioning) [temperature]"
          - "lower [the] (AC|A C|aircon|air conditioner|air conditioning) [temperature]"
      - trigger: conversation
        id: fan_set
        command:
          - "[set|turn] [the] (AC|A C|aircon|air conditioner|air conditioning) fan [speed] to {speed}"
          - "(AC|A C|aircon|air conditioner|air conditioning) fan {speed}"
      - trigger: conversation
        id: fan_up
        command:
          - "(turn up|increase|raise) [the] (AC|A C|aircon|air conditioner|air conditioning) fan"
          - "more (AC|A C|aircon|air conditioner|air conditioning) fan"
      - trigger: conversation
        id: fan_down
        command:
          - "(turn down|decrease|lower) [the] (AC|A C|aircon|air conditioner|air conditioning) fan"
          - "less (AC|A C|aircon|air conditioner|air conditioning) fan"
    actions:
      - variables:
          temp_now: "{{ states('input_number.bedroom_ac_temp') | int(22) }}"
          fan_now: "{{ states('input_select.bedroom_ac_fan') }}"
          ac_on: "{{ is_state('input_boolean.bedroom_ac_on', 'on') }}"
          raw: "{{ (trigger.slots.value | default('') | string | lower | replace('°', '') | replace('degrees', '') | trim) }}"
          speed_raw: "{{ trigger.slots.speed | default('') | string | lower | trim }}"
          fan_words:
            low: low
            slow: low
            medium: med
            med: med
            middle: med
            high: high
            fast: high
            max: high
            auto: auto
            automatic: auto
          mode_words:
            cool: cool
            cooling: cool
            cold: cool
            heat: heat
            heating: heat
            warm: heat
          new_temp: >-
            {% if trigger.id == 'warmer' %}{{ [temp_now + 1, 30] | min }}
            {% elif trigger.id == 'cooler' %}{{ [temp_now - 1, 16] | max }}
            {% elif trigger.id == 'set' and raw | regex_match('^\\d+(\\.\\d+)?$') %}{{ [[raw | float | round(0) | int, 16] | max, 30] | min }}
            {% else %}none{% endif %}
          new_mode: "{{ mode_words.get(raw, 'none') if trigger.id == 'set' else 'none' }}"
          new_fan: >-
            {% set up = {'low': 'med', 'med': 'high', 'high': 'high', 'auto': 'high'} %}
            {% set down = {'high': 'med', 'med': 'low', 'low': 'low', 'auto': 'med'} %}
            {% if trigger.id == 'fan_up' %}{{ up.get(fan_now, 'med') }}
            {% elif trigger.id == 'fan_down' %}{{ down.get(fan_now, 'med') }}
            {% elif trigger.id == 'fan_set' %}{{ fan_words.get(speed_raw, 'none') }}
            {% else %}none{% endif %}
          off_note: "{{ '' if ac_on else ' The AC is off, so this applies when it is next turned on.' }}"
      - choose:
          - conditions: "{{ new_temp != 'none' }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.bedroom_ac_temp
                data:
                  value: "{{ new_temp | int }}"
              - set_conversation_response: "AC set to {{ new_temp | int }} degrees.{{ off_note }}"
          - conditions: "{{ new_mode != 'none' }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.bedroom_ac_mode
                data:
                  option: "{{ new_mode }}"
              - set_conversation_response: "AC set to {{ 'cooling' if new_mode == 'cool' else 'heating' }}.{{ off_note }}"
          - conditions: "{{ new_fan != 'none' }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.bedroom_ac_fan
                data:
                  option: "{{ new_fan }}"
              - set_conversation_response: "AC fan {{ {'med': 'medium'}.get(new_fan, new_fan) }}.{{ off_note }}"
        default:
          - set_conversation_response: "Sorry, I can set the AC to 16 to 30 degrees, cooling or heating, and the fan to low, medium, high or auto."
